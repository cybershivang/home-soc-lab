services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    volumes:
      - /opt/netalertx/data:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:uid=20211,gid=20211,mode=1700
    environment:
      PORT: '20211'
      LISTEN_ADDR: '<VM_IP>'
      APP_CONF_OVERRIDE: >-
        {"GRAPHQL_PORT":"20212","SCAN_SUBNETS":"['<LAN_SUBNET>/24 --interface=<IFACE>']"}
